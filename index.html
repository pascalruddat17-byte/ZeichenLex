<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeichenLex">
  <title>ZeichenLex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <div class="brand">
      <img src="icons/icon-192.png" class="brand-icon" alt="">
      <div>
        <h1>ZeichenLex</h1>
        <div class="sub">Gebärden schnell speichern & abspielen</div>
      </div>
    </div>
    <button id="installBtn" class="install-btn hidden">⬇ Installieren</button>
  </div>

  <div id="searchWrap" class="search-row">
    <input id="search" class="input" placeholder="Wort suchen …" autocomplete="off">
    <button id="addTop" class="primary square" aria-label="Gebärde hinzufügen">＋</button>
  </div>
</header>

<main class="app">
  <section id="dictView">
    <div class="stats">
      <span id="count">0 Einträge</span>
      <span id="storageState">auf diesem Gerät</span>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="translatorView" class="hidden">
    <div class="translator">
      <h2>🔤 Text → Gebärden</h2>
      <p>Schreib einen deutschen Satz. ZeichenLex sucht die passenden Einträge und spielt die Videos der Reihe nach ab.</p>

      <div class="translate-row">
        <input id="translateText" class="input" placeholder="z. B. Hallo wie geht es dir?">
        <button id="translateBtn" class="primary translate-btn">Übersetzen</button>
      </div>

      <div id="sequence" class="sequence"></div>

      <div id="playerBar" class="player-bar hidden">
        <button id="playAll" class="primary">▶ Alles abspielen</button>
        <button id="stopAll" class="ghost">■ Stop</button>
      </div>
      <div id="translateStatus" class="status"></div>
    </div>
  </section>
</main>

<nav class="bottom">
  <button class="navbtn active" id="navDict">📚<br>Wörterbuch</button>
  <button class="navbtn" id="navTranslate">🔤<br>Übersetzen</button>
  <button class="navbtn" id="navAdd">➕<br>Hinzufügen</button>
</nav>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheet-top">
      <h2 id="modalTitle">Neue Gebärde</h2>
      <button id="close" class="x">✕</button>
    </div>

    <form id="form" class="form">
      <input type="hidden" id="editId">

      <div class="field">
        <label>WORT *</label>
        <input id="word" class="input" required placeholder="z. B. Hallo" autocomplete="off">
      </div>

      <div class="field">
        <label>NOTIZ <span>(optional)</span></label>
        <textarea id="notes" class="input" placeholder="Nur wenn du etwas dazuschreiben willst"></textarea>
      </div>

      <div class="field">
        <label>VIDEO ODER FOTO</label>
        <div class="upload">
          <div class="upload-grid">
            <label class="file-btn">📁 Galerie
              <input id="mediaFile" type="file" accept="image/*,video/*" hidden>
            </label>

            <label class="file-btn">📷 Foto
              <input id="photoFile" type="file" accept="image/*" capture="environment" hidden>
            </label>

            <label class="file-btn wide">🎥 Video aufnehmen
              <input id="videoFile" type="file" accept="video/*" capture="environment" hidden>
            </label>
          </div>
          <div class="hint">Nur das Wort ist Pflicht.</div>
          <div id="preview" class="preview"></div>
        </div>
      </div>

      <button class="save" type="submit">Speichern</button>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
